[build-system]
requires = [
    "setuptools>=60",
    "setuptools-scm>=8.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "edges-pipeline-utils"
version = "0.1.0"
description = "Utilities for running pipelines on EDGES data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy-healpix>=1.0.3",
    "edges-analysis>=7.0.0",
    "edges-cal>=7.0.0",
    "edges-estimate>=1.3.0",
    "edges-io>=4.1.7",
    "edges-pipelines",
    "jupyter>=1.1.1",
    "nbconvert>=7.16.4",
    "papermill>=2.6.0",
    "pygsdata>=0.2.0",
    "read-acq>=1.1.0",
]

[project.scripts]
epipe = "edges_pipeline_utils.cli:app"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    'output-notebooks'
]

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "E",    # pycodestyle
  "W",    # pycodestyle warning
  "F",    # pyflakes
  "C90",  # mccabe complexity
  "I",    # isort
  "N",    # pep8-naming
  "D",    # docstyle
  # "ANN"   # type annotations
  "B",    # bugbear
  "A",    # builtins
  "C4",   # comprehensions
  "DTZ",  # datetime
  "FA",   # future annotations
  "PIE",  # flake8-pie
  "T",    # print statements
  "PT",   # pytest-style
  "Q",    # quotes
  "SIM",  # simplify
  "PTH",  # use Pathlib
  "ERA",  # kill commented code
  "NPY",  # numpy-specific rules
  "PERF", # performance
  # "FURB", # refurb
  "RUF",  # ruff-specific rules
  "RET",  # return statements
  "RSE",  # exception raises
  "TRY201", # verbose raise
]



ignore = [
    "DTZ007",   # use %z in strptime
    "N806",  # Variable name should be lower case. We have some single-letter variables that make more sense to be caps.
    "A003",  # Class attribute shadows a python builtin -- not much chance of that causing a problem
    "D401",  # First line should be in imperative mood -- cached_properties don't fit this bill.
    "D101",  # Missing docstring in public class -- my docstrings are in the __init__ which seems to fail this ?
    "N815",
    "N807",  # Allow method names to start and end with __
    "B008",  # allow setting defaults that call functions
    "RUF012", # mutable class attributes annotation
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = [
    "A",  # conf.py can shadow builtins
    "ERA",
    "DTZ",
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'
property-decorators = [
    "property",
    "functools.cached_property",
    "pytest.fixture"
]
[tool.ruff.lint.mccabe]
max-complexity = 21

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.8",
    "setuptools-scm>=8.1.0",
]

[tool.uv.sources]
edges-pipelines = { workspace = true }


